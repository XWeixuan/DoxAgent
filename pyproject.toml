[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "doxagent"
version = "0.1.0"
description = "Blackboard-centered agent infrastructure for US equity message-side research."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
    "exchange-calendars>=4.11,<5",
    "agent-framework-core>=1.6,<2",
    "anthropic>=0.71,<1",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "langsmith>=0.8,<1",
    "openai>=2,<3",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.2,<2",
    "websockets>=15,<16",
    "yfinance>=0.2,<0.3",
    "trafilatura>=2,<3",
    "curl-cffi>=0.15,<1",
    "cryptography>=50,<51",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "openai-codex==0.144.4",
    "mcp==2.0.0",
    "pypdf>=6,<7",
    "playwright>=1.55,<2",
]

[project.scripts]
doxagent-ticker-init = "doxagent.ticker_initialization.cli:main"
doxagent-v2-delivery = "doxagent.persistent_runtime_v2.delivery_worker:main"
doxagent-v2-control = "doxagent.v2_control.worker:main"
doxagent-v2-read = "doxagent.v2_read.cli:main"
doxagent-v2-api = "doxagent.api_v2.cli:main"
doxagent-v2-scheduler = "doxagent.runtime_scheduler.v2:main"
cdecr = "cdecr.cli:main"
codex-document3 = "doxagent.workflows.codex_document3.cli:main"
doxagent-crawler-plane = "doxagent.crawler_plane.cli:main"
doxagent-monitoring-o4 = "doxagent.workflows.codex_monitoring_o4.cli:main"
doxagent-monitoring-o4-pilot = "doxagent.workflows.codex_monitoring_o4.pilot_cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
    "types-jsonschema>=4.23,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/doxagent", "src/cdecr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "real_api: tests that call real external free-tier APIs and consume quota",
    "real_db: tests that connect to real Supabase/Postgres persistence",
    "cdecr_real_models: CDECR tests that consume real DashScope model quota",
    "cdecr_real_db: CDECR tests that read the real DoxAtlas Supabase project",
    "cdecr_real_step2: CDECR 24-document step-two quality and idempotence acceptance",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".uv-cache", ".venv", "references"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["doxagent", "cdecr"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
