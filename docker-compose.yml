name: doxagent

services:
  message-bus-v2-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: doxagent:latest
    container_name: doxagent-message-bus-v2-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      DOXAGENT_STORAGE_MODE: ${DOXAGENT_STORAGE_MODE:-memory}
      DOXAGENT_MESSAGE_BUS_V2_ENABLED: ${DOXAGENT_MESSAGE_BUS_V2_ENABLED:-false}
      DOXAGENT_MESSAGE_BUS_V2_SQLITE_PATH: /app/.tmp/message_bus_v2.sqlite3
      DOXAGENT_MESSAGE_BUS_V2_WORKER_SLEEP_SECONDS: ${DOXAGENT_MESSAGE_BUS_V2_WORKER_SLEEP_SECONDS:-1}
      DOXAGENT_MESSAGE_BUS_V2_ADAPTER_ROOT: /app/.tmp/message_bus_v2_adapters
      DOXAGENT_CRAWLER_PLANE_ROOT: /var/lib/doxagent/workspaces/crawler-plane
      DOXAGENT_CRAWLER_PLANE_SQLITE_PATH: /var/lib/doxagent/workspaces/crawler-plane/crawler_plane.sqlite3
      DOXAGENT_CRAWLER_PLANE_WORKER_PROCESSES: ${DOXAGENT_CRAWLER_PLANE_WORKER_PROCESSES:-4}
    command:
      [
        "python",
        "-m",
        "doxagent.message_bus_v2.cli",
        "run-worker",
      ]
    volumes:
      - doxagent-cache:/root/.cache
      - doxagent-tmp:/app/.tmp
      - crawler-plane:/var/lib/doxagent/workspaces/crawler-plane

  monitoring-o4-worker:
    profiles:
      - codex-v2
    build:
      context: .
      dockerfile: Dockerfile
    image: doxagent:latest
    container_name: doxagent-monitoring-o4-worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      PYTHONPATH: /app
      DOXAGENT_CODEX_MONITORING_O4_ENABLED: ${DOXAGENT_CODEX_MONITORING_O4_ENABLED:-false}
      DOXAGENT_CODEX_MONITORING_O4_SQLITE_PATH: /app/.tmp/codex-monitoring-o4.sqlite3
      DOXAGENT_CODEX_MONITORING_O4_MODEL: ${DOXAGENT_CODEX_MONITORING_O4_MODEL:-gpt-5.6-sol}
      DOXAGENT_CODEX_WORKER_BASE_URL: http://codex-worker:8791
      DOXAGENT_CODEX_WORKER_BEARER_TOKEN: ${DOXAGENT_CODEX_WORKER_BEARER_TOKEN:-}
      DOXAGENT_CODEX_CAPABILITY_SECRET: ${DOXAGENT_CODEX_CAPABILITY_SECRET:-}
      DOXAGENT_MESSAGE_BUS_V2_ENABLED: ${DOXAGENT_MESSAGE_BUS_V2_ENABLED:-false}
      DOXAGENT_MESSAGE_BUS_V2_SQLITE_PATH: /app/.tmp/message_bus_v2.sqlite3
      DOXAGENT_MESSAGE_BUS_V2_ADAPTER_ROOT: /app/.tmp/message_bus_v2_adapters
      DOXAGENT_CRAWLER_PLANE_ROOT: /var/lib/doxagent/workspaces/crawler-plane
      DOXAGENT_CRAWLER_PLANE_SQLITE_PATH: /var/lib/doxagent/workspaces/crawler-plane/crawler_plane.sqlite3
      DOXAGENT_CRAWLER_PLANE_WORKER_PROCESSES: ${DOXAGENT_CRAWLER_PLANE_WORKER_PROCESSES:-4}
    command: ["python", "-m", "doxagent.workflows.codex_monitoring_o4.worker"]
    depends_on:
      codex-worker:
        condition: service_healthy
    volumes:
      - doxagent-tmp:/app/.tmp
      - crawler-plane:/var/lib/doxagent/workspaces/crawler-plane

  runtime-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args:
        VITE_CODEX_D1_V2_ENABLED: ${VITE_CODEX_D1_V2_ENABLED:-false}
        VITE_CODEX_RESEARCH_LANES_ENABLED: ${VITE_CODEX_RESEARCH_LANES_ENABLED:-false}
    image: doxagent-dashboard:latest
    container_name: doxagent-runtime-scheduler
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
      - path: .env.dashboard
        required: false
    environment:
      PYTHONPATH: /app
      DOXAGENT_DASHBOARD_API_MODE: real
      DOXAGENT_STORAGE_MODE: ${DOXAGENT_STORAGE_MODE:-memory}
      DOXAGENT_RUNTIME_SCHEDULER_LOOP_SLEEP_SECONDS: ${DOXAGENT_RUNTIME_SCHEDULER_LOOP_SLEEP_SECONDS:-15}
      DOXAGENT_MESSAGE_BUS_V2_ENABLED: ${DOXAGENT_MESSAGE_BUS_V2_ENABLED:-false}
      DOXAGENT_MESSAGE_BUS_V2_SQLITE_PATH: /app/.tmp/message_bus_v2.sqlite3
      DOXAGENT_CRAWLER_PLANE_ROOT: /var/lib/doxagent/workspaces/crawler-plane
      DOXAGENT_CRAWLER_PLANE_SQLITE_PATH: /var/lib/doxagent/workspaces/crawler-plane/crawler_plane.sqlite3
      DOXAGENT_CRAWLER_PLANE_WORKER_PROCESSES: ${DOXAGENT_CRAWLER_PLANE_WORKER_PROCESSES:-4}
      DOXAGENT_MODEL_USAGE_STORAGE_MODE: postgres
      DOXAGENT_MODEL_PRICING_CONFIG_PATH: ${DOXAGENT_MODEL_PRICING_CONFIG_PATH:-}
      DOXAGENT_MODEL_PRICING_DISCOUNT_RATE: ${DOXAGENT_MODEL_PRICING_DISCOUNT_RATE:-0.45}
      DOXAGENT_MODEL_PRICING_CNY_USD_RATE: ${DOXAGENT_MODEL_PRICING_CNY_USD_RATE:-6.8}
    command:
      [
        "python",
        "-m",
        "doxagent.runtime_scheduler.cli",
        "run-loop",
        "--sleep-seconds",
        "${DOXAGENT_RUNTIME_SCHEDULER_LOOP_SLEEP_SECONDS:-15}",
      ]
    volumes:
      - doxagent-cache:/root/.cache
      - doxagent-tmp:/app/.tmp
      - crawler-plane:/var/lib/doxagent/workspaces/crawler-plane
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "doxagent.runtime_scheduler.cli",
          "overview",
        ]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s

  revenue-auditor:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: doxagent-dashboard:latest
    container_name: doxagent-revenue-auditor
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
      - path: .env.dashboard
        required: false
    environment:
      PYTHONPATH: /app
      DOXAGENT_PERSISTENT_RUNTIME_STORAGE_MODE: sqlite
      DOXAGENT_PERSISTENT_RUNTIME_SQLITE_PATH: /app/.tmp/persistent_runtime_execution.sqlite3
      DOXAGENT_REVENUE_AUDIT_STORAGE_MODE: sqlite
      DOXAGENT_REVENUE_AUDIT_SQLITE_PATH: /app/.tmp/revenue_audit.sqlite3
      DOXAGENT_REVENUE_AUDIT_MARKET_DATA_PROVIDER: ${DOXAGENT_REVENUE_AUDIT_MARKET_DATA_PROVIDER:-twelvedata}
      DOXAGENT_REVENUE_AUDIT_LOOP_SLEEP_SECONDS: ${DOXAGENT_REVENUE_AUDIT_LOOP_SLEEP_SECONDS:-60}
    command:
      [
        "python",
        "-m",
        "doxagent.revenue_audit.cli",
        "run-loop",
        "--sleep-seconds",
        "${DOXAGENT_REVENUE_AUDIT_LOOP_SLEEP_SECONDS:-60}",
        "--quiet",
      ]
    volumes:
      - doxagent-cache:/root/.cache
      - doxagent-tmp:/app/.tmp

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: doxagent-dashboard:latest
    container_name: doxagent-dashboard
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
      - path: .env.dashboard
        required: false
    environment:
      PYTHONPATH: /app
      DOXAGENT_DASHBOARD_API_MODE: real
      DOXAGENT_DASHBOARD_AUTH_MODE: ${DOXAGENT_DASHBOARD_AUTH_MODE:-supabase}
      DOXAGENT_DASHBOARD_STATIC_DIR: /app/frontend/dashboard/dist
      DOXAGENT_STORAGE_MODE: ${DOXAGENT_STORAGE_MODE:-memory}
      DOXAGENT_PERSISTENT_RUNTIME_STORAGE_MODE: sqlite
      DOXAGENT_PERSISTENT_RUNTIME_SQLITE_PATH: /app/.tmp/persistent_runtime_execution.sqlite3
      DOXAGENT_REVENUE_AUDIT_STORAGE_MODE: sqlite
      DOXAGENT_REVENUE_AUDIT_SQLITE_PATH: /app/.tmp/revenue_audit.sqlite3
      DOXAGENT_REVENUE_AUDIT_MARKET_DATA_PROVIDER: ${DOXAGENT_REVENUE_AUDIT_MARKET_DATA_PROVIDER:-twelvedata}
      DOXAGENT_MESSAGE_BUS_V2_ENABLED: ${DOXAGENT_MESSAGE_BUS_V2_ENABLED:-false}
      DOXAGENT_MESSAGE_BUS_V2_SQLITE_PATH: /app/.tmp/message_bus_v2.sqlite3
      DOXAGENT_CRAWLER_PLANE_ROOT: /var/lib/doxagent/workspaces/crawler-plane
      DOXAGENT_CRAWLER_PLANE_SQLITE_PATH: /var/lib/doxagent/workspaces/crawler-plane/crawler_plane.sqlite3
      DOXAGENT_CRAWLER_PLANE_WORKER_PROCESSES: ${DOXAGENT_CRAWLER_PLANE_WORKER_PROCESSES:-4}
      DOXAGENT_MODEL_USAGE_STORAGE_MODE: postgres
      DOXAGENT_MODEL_PRICING_CONFIG_PATH: ${DOXAGENT_MODEL_PRICING_CONFIG_PATH:-}
      DOXAGENT_MODEL_PRICING_DISCOUNT_RATE: ${DOXAGENT_MODEL_PRICING_DISCOUNT_RATE:-0.45}
      DOXAGENT_MODEL_PRICING_CNY_USD_RATE: ${DOXAGENT_MODEL_PRICING_CNY_USD_RATE:-6.8}
      DOXAGENT_CODEX_D1_V2_ENABLED: ${DOXAGENT_CODEX_D1_V2_ENABLED:-false}
      DOXAGENT_CODEX_RESEARCH_LANES_ENABLED: ${DOXAGENT_CODEX_RESEARCH_LANES_ENABLED:-false}
      DOXAGENT_CODEX_MONITORING_O4_ENABLED: ${DOXAGENT_CODEX_MONITORING_O4_ENABLED:-false}
      DOXAGENT_CODEX_MONITORING_O4_SQLITE_PATH: /app/.tmp/codex-monitoring-o4.sqlite3
      DOXAGENT_CODEX_WORKER_BASE_URL: ${DOXAGENT_CODEX_WORKER_BASE_URL:-http://codex-worker:8791}
      DOXAGENT_CODEX_WORKER_BEARER_TOKEN: ${DOXAGENT_CODEX_WORKER_BEARER_TOKEN:-}
      DOXAGENT_CODEX_CAPABILITY_SECRET: ${DOXAGENT_CODEX_CAPABILITY_SECRET:-}
      DOXAGENT_CODEX_RUNTIME_STORAGE_MODE: ${DOXAGENT_CODEX_RUNTIME_STORAGE_MODE:-sqlite}
      DOXAGENT_CODEX_RUNTIME_SQLITE_PATH: /app/.tmp/codex-runtime.sqlite3
      DOXAGENT_CODEX_REMOTE_RUNTIME_STORAGE_ENABLED: ${DOXAGENT_CODEX_REMOTE_RUNTIME_STORAGE_ENABLED:-false}
      DOXAGENT_CODEX_HYBRID_LOCAL_MIRROR_ENABLED: ${DOXAGENT_CODEX_HYBRID_LOCAL_MIRROR_ENABLED:-true}
      DOXAGENT_CODEX_PUBLISHED_STORAGE_URL: ${DOXAGENT_CODEX_PUBLISHED_STORAGE_URL:-}
      DOXAGENT_CODEX_PUBLISHED_STORAGE_SECRET_KEY: ${DOXAGENT_CODEX_PUBLISHED_STORAGE_SECRET_KEY:-}
      DOXAGENT_CODEX_PUBLISHED_STORAGE_BUCKET: ${DOXAGENT_CODEX_PUBLISHED_STORAGE_BUCKET:-codex-published-documents}
    ports:
      - "127.0.0.1:8780:8780"
    volumes:
      - doxagent-cache:/root/.cache
      - doxagent-tmp:/app/.tmp
      - crawler-plane:/var/lib/doxagent/workspaces/crawler-plane
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8780/healthz', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  codex-worker:
    profiles:
      - codex-v2
    build:
      context: .
      dockerfile: Dockerfile.codex-worker
    image: doxagent-codex-worker:latest
    container_name: doxagent-codex-worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      PYTHONPATH: /app/src
      CODEX_HOME: /var/lib/codex
      DOXAGENT_CODEX_CONTAINER_ISOLATION: "true"
      DOXAGENT_CODEX_WORKSPACE_ROOT: /var/lib/doxagent/workspaces
      DOXAGENT_CODEX_WORKER_BEARER_TOKEN: ${DOXAGENT_CODEX_WORKER_BEARER_TOKEN:-}
      DOXAGENT_CODEX_CAPABILITY_SECRET: ${DOXAGENT_CODEX_CAPABILITY_SECRET:-}
      DOXAGENT_CRAWLER_PLANE_ROOT: /var/lib/doxagent/workspaces/crawler-plane
      DOXAGENT_CRAWLER_PLANE_SQLITE_PATH: /var/lib/doxagent/workspaces/crawler-plane/crawler_plane.sqlite3
      DOXAGENT_CRAWLER_PLANE_WORKER_PROCESSES: ${DOXAGENT_CRAWLER_PLANE_WORKER_PROCESSES:-4}
      DOXAGENT_MESSAGE_BUS_V2_ENABLED: ${DOXAGENT_MESSAGE_BUS_V2_ENABLED:-false}
      DOXAGENT_MESSAGE_BUS_V2_SQLITE_PATH: /app/.tmp/message_bus_v2.sqlite3
      DOXAGENT_MESSAGE_BUS_V2_ADAPTER_ROOT: /app/.tmp/message_bus_v2_adapters
    ports:
      - "127.0.0.1:8791:8791"
    volumes:
      - codex-worker-workspaces:/var/lib/doxagent/workspaces
      - codex-worker-home:/var/lib/codex
      - crawler-plane:/var/lib/doxagent/workspaces/crawler-plane
      - doxagent-tmp:/app/.tmp
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8791/healthz', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  doxagent-cache:
  doxagent-tmp:
  codex-worker-workspaces:
  codex-worker-home:
  crawler-plane:
