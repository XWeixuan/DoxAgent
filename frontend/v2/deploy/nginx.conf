# Serve the independent V2 build; replace v2-api:8000 with the V2 API service.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  location /api/doxagent/v2/ {
    proxy_pass http://v2-api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    gzip off;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
  }
  location /api/ { return 404; }
  location = /healthz { access_log off; return 200 "ok\n"; }
  location /assets/ { try_files $uri =404; expires 1y; }
  location /fonts/ { try_files $uri =404; expires 7d; }
  location = /index.html { add_header Cache-Control "no-store"; }
  location / { try_files $uri $uri/ /index.html; }
}
