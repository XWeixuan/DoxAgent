x-resource-budget: &resource-budget
  cgroup_parent: doxagent-app.slice

services:
  v2-migrate:
    <<: *resource-budget
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 96
    image: ${DOXAGENT_V2_IMAGE:-doxagent-v2:server}
  v2-api:
    <<: *resource-budget
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 1.5
    pids_limit: 128
    image: ${DOXAGENT_V2_IMAGE:-doxagent-v2:server}
  v2-control:
    <<: *resource-budget
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 0.5
    pids_limit: 64
    image: ${DOXAGENT_V2_IMAGE:-doxagent-v2:server}
    environment:
      DOXAGENT_CDECR_EXECUTION_MODE: PREBUILT_REQUIRED
  codex-worker:
    <<: *resource-budget
    volumes: ["/run/doxagent-resources:/run/doxagent-resources"]
    mem_limit: 3584m
    memswap_limit: 3584m
    cpus: 2.75
    pids_limit: 512
    environment:
      DOXAGENT_RESOURCE_SOCKET: /run/doxagent-resources/guardian.sock
      DOXAGENT_CODEX_WORKER_CAPACITY: "2"
      DOXAGENT_CODEX_WORKER_QUEUE_LIMIT: "64"
      DOXAGENT_CODEX_WORKER_SUBAGENTS: "0"
      DOXAGENT_CODEX_WORKER_PRESSURE_ENABLED: "true"
    image: ${DOXAGENT_V2_IMAGE:-doxagent-v2:server}
    extra_hosts: ["host.docker.internal:host-gateway"]
  v2-initialization:
    <<: *resource-budget
    volumes: ["/run/doxagent-resources:/run/doxagent-resources"]
    mem_limit: 640m
    memswap_limit: 640m
    cpus: 0.75
    pids_limit: 128
    image: ${DOXAGENT_V2_IMAGE:-doxagent-v2:server}
    environment:
      DOXAGENT_RESOURCE_SOCKET: /run/doxagent-resources/guardian.sock
      DOXAGENT_CDECR_EXECUTION_MODE: PREBUILT_REQUIRED
      DOXAGENT_CODEX_D2_MAX_CONCURRENCY: "2"
    extra_hosts: ["host.docker.internal:host-gateway"]
  v2-message-bus:
    <<: *resource-budget
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: 1.0
    pids_limit: 256
    shm_size: 256m
    image: ${DOXAGENT_V2_IMAGE:-doxagent-v2:server}
  v2-content-enrichment:
    <<: *resource-budget
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 1.0
    pids_limit: 128
    image: ${DOXAGENT_V2_IMAGE:-doxagent-v2:server}
  v2-o4:
    <<: *resource-budget
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 96
    image: ${DOXAGENT_V2_IMAGE:-doxagent-v2:server}
    extra_hosts: ["host.docker.internal:host-gateway"]
  v2-scheduler:
    <<: *resource-budget
    volumes: ["/run/doxagent-resources:/run/doxagent-resources"]
    mem_limit: 1024m
    memswap_limit: 1536m
    cpus: 1.0
    pids_limit: 128
    environment:
      DOXAGENT_RESOURCE_SOCKET: /run/doxagent-resources/guardian.sock
      DOXAGENT_PERSISTENT_RUNTIME_V2_W3_MAX_TICKER_CONCURRENCY: "2"
    image: ${DOXAGENT_V2_IMAGE:-doxagent-v2:server}
    extra_hosts: ["host.docker.internal:host-gateway"]
  v2-projector:
    <<: *resource-budget
    volumes: ["/run/doxagent-resources:/run/doxagent-resources"]
    environment:
      DOXAGENT_RESOURCE_SOCKET: /run/doxagent-resources/guardian.sock
    mem_limit: 384m
    memswap_limit: 640m
    cpus: 1.0
    pids_limit: 64
    image: ${DOXAGENT_V2_IMAGE:-doxagent-v2:server}
  v2-delivery:
    <<: *resource-budget
    mem_limit: 256m
    memswap_limit: 384m
    cpus: 0.25
    pids_limit: 64
    image: ${DOXAGENT_V2_IMAGE:-doxagent-v2:server}
  v2-executor:
    <<: *resource-budget
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 0.5
    pids_limit: 96
    image: ${DOXAGENT_V2_IMAGE:-doxagent-v2:server}

  v2-web:
    <<: *resource-budget
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    pids_limit: 64

volumes:
  v2-data:
    external: true
    name: ${DOXAGENT_V2_DATA_VOLUME:-doxagent-v2_v2-data}
